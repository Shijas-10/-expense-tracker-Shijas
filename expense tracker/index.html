<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>💰 Expense Tracker</h1>
            <p class="subtitle">Track your income and expenses</p>
        </header>

        <!-- Summary Section -->
        <section class="summary-section">
            <div class="summary-card income">
                <h3>Total Income</h3>
                <p class="summary-value" id="totalIncome">$0.00</p>
            </div>
            <div class="summary-card expense">
                <h3>Total Expenses</h3>
                <p class="summary-value" id="totalExpenses">$0.00</p>
            </div>
            <div class="summary-card balance">
                <h3>Balance</h3>
                <p class="summary-value" id="balance">$0.00</p>
            </div>
        </section>

        <!-- Form Section -->
        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm" class="transaction-form">
                <!-- Type Selection -->
                <div class="form-group">
                    <label>Type *</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="type" value="income" required>
                            Income
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="type" value="expense" required>
                            Expense
                        </label>
                    </div>
                    <span class="error-message" id="typeError"></span>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="amount">Amount * ($)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00" required>
                    <span class="error-message" id="amountError"></span>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">-- Select Category --</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error-message" id="categoryError"></span>
                </div>

                <!-- Date -->
                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="date" id="date" name="date" required>
                    <span class="error-message" id="dateError"></span>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Description *</label>
                    <input type="text" id="description" name="description" placeholder="Brief description" maxlength="100" required>
                    <span class="error-message" id="descriptionError"></span>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Add Transaction</button>
                    <button type="reset" id="resetBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                </div>
            </form>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <h2>Filters</h2>
            <div class="filter-group">
                <div class="filter-item">
                    <label for="typeFilter">Type:</label>
                    <select id="typeFilter">
                        <option value="">All</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <button type="button" id="clearFiltersBtn" class="btn btn-small">Clear Filters</button>
            </div>
        </section>

        <!-- Transactions Section -->
        <section class="transactions-section">
            <h2>Transactions</h2>
            <div id="emptyState" class="empty-state">
                <p>📋 No transactions yet. Add one to get started!</p>
            </div>
            <div id="transactionsContainer" class="transactions-container"></div>
        </section>
    </div>

    <!-- Success Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
